name: Validate desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - name: Require native Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts && git diff --exit-code -- packages/contracts
      - run: cargo fmt --all -- --check
      - run: pnpm check
      - run: pnpm lint
      - run: cargo test --workspace --locked
      - run: pnpm --filter @diffcity/desktop exec vitest run --maxWorkers=2 --testTimeout=15000
      - run: pnpm release:check
      - name: Build and verify Apple silicon app
        run: pnpm desktop:build
