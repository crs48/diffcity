name: Validate desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - name: Require native Apple silicon runner
        run: test "$(uname -m)" = arm64
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts && git diff --exit-code -- packages/contracts
      - run: cargo fmt --all -- --check
      - run: pnpm check
      - run: pnpm lint
      - run: cargo test --workspace --locked
      - run: pnpm --filter @diffcity/desktop exec vitest run --maxWorkers=2 --testTimeout=15000
      - run: pnpm release:check
      - name: Build and verify Apple silicon app
        run: pnpm desktop:build
